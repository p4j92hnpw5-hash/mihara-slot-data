name: Slorepo Access Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Slorepo access
        run: |
          python3 - <<'PY'
          import urllib.request
          import urllib.error

          url = "https://www.slorepo.com/hall/221/20261102/matsubi/?kishu=%E3%83%9E%E3%82%A4%E3%82%B8%E3%83%A3%E3%82%B0%E3%83%A9%E3%83%BCV&history=7&filter=none"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as res:
                  body = res.read()
                  print("HTTP status:", res.status)
                  print("Bytes:", len(body))
                  print("Contains 869:", b"869" in body)
          except urllib.error.HTTPError as e:
              print("HTTP error:", e.code)
              raise
          PY
