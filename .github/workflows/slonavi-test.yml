name: Slonavi Structure Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Slonavi HTML
        run: |
          python3 - <<'PY'
          import urllib.request
          from html.parser import HTMLParser

          url = "https://slo-navi.com/data/2025-11-07-11019/?kishu=all&sort=num"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})

          class TableReader(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_cell = False
                  self.cell = []
                  self.row = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.row = []
                  if tag in ("td", "th"):
                      self.in_cell = True
                      self.cell = []
              def handle_data(self, data):
                  if self.in_cell:
                      self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag in ("td", "th"):
                      self.in_cell = False
                      self.row.append(" ".join("".join(self.cell).split()))
                  if tag == "tr" and self.row:
                      self.rows.append(self.row[:])

          with urllib.request.urlopen(req, timeout=30) as res:
              body = res.read()
              print("HTTP:", res.status, "Bytes:", len(body))
          parser = TableReader()
          parser.feed(body.decode("utf-8", errors="replace"))
          print("HTML table rows:", len(parser.rows))
          print("First 5 rows:")
          for row in parser.rows[:5]:
              print(repr(row)[:500])
          print("Rows containing exact 869:")
          found = 0
          for row in parser.rows:
              if any(cell == "869" for cell in row):
                  print(repr(row)[:800])
                  found += 1
                  if found >= 3:
                      break
          print("Matching rows:", found)
          PY
